services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smimelifecycle
      POSTGRES_USER: smime
      POSTGRES_PASSWORD: smime
    ports:
      - "5432:5432"
    volumes:
      - smime_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smime -d smimelifecycle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smime_pg:
